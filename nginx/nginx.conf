# /etc/nginx/sites-available/ziggy
# Ziggy Food App — Web Tier Nginx Configuration
#
# Role: Serve static frontend AND proxy API calls to the internal ALB
#       which routes traffic to Node.js app servers in private subnets.
#
# Traffic flow:
#   User → Internet ALB → This EC2 (Nginx) → Internal ALB → Node.js EC2

server {
    listen 80;
    server_name _;

    # Serve the React/HTML frontend from /var/www/html
    root /var/www/html;
    index index.html;

    # Static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the internal Application Load Balancer
    # Replace INTERNAL_ALB_DNS with your internal ALB DNS name
    location /api/ {
        proxy_pass         http://INTERNAL_ALB_DNS:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # Health check endpoint for the external ALB target group
    location /health {
        proxy_pass http://INTERNAL_ALB_DNS:3000/health;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
    }
}
